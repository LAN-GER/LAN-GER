<svg xmlns="http://www.w3.org/2000/svg" width="720" height="66" viewBox="0 0 720 66" role="img" aria-labelledby="title">
  <title id="title">Hi, I'm LAN-GER. Exploring robotics and MuJoCo. Building ideas into reality.</title>
  <style>
    .row{opacity:0;animation:show 15s linear infinite}
    .second{animation-delay:5s}.third{animation-delay:10s}
    .reveal{animation:typing 5s steps(32,end) infinite}
    .cursor{animation:blink .8s steps(1,end) infinite}
    @keyframes show{0%,32.9%{opacity:1}33%,100%{opacity:0}}
    @keyframes typing{0%{width:0}65%,88%{width:590px}100%{width:0}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.row{animation:none}.first{opacity:1}.reveal{animation:none;width:590px}.cursor{animation:none}}
  </style>
  <defs><clipPath id="text-reveal"><rect class="reveal" x="65" y="0" width="590" height="66"/></clipPath></defs>
  <g clip-path="url(#text-reveal)" font-family="Consolas,monospace" font-size="25" fill="#0891b2">
    <text class="row first" x="65" y="42">&gt; Hi, I'm LAN-GER.<tspan class="cursor">_</tspan></text>
    <text class="row second" x="65" y="42">&gt; Exploring robotics and MuJoCo.<tspan class="cursor">_</tspan></text>
    <text class="row third" x="65" y="42">&gt; Building ideas into reality.<tspan class="cursor">_</tspan></text>
  </g>
</svg>
